<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Anet: The Magical Adventure – app icon (full-bleed square; iOS/Android round the corners) -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#ffe9a8" />
      <stop offset="0.38" stop-color="#ffb35c" />
      <stop offset="0.72" stop-color="#f0709a" />
      <stop offset="1" stop-color="#6a4cf0" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f39a4a" />
      <stop offset="1" stop-color="#d9662a" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e29" />
      <stop offset="1" stop-color="#211915" />
    </linearGradient>
    <path id="spark" d="M0 -1C.12 -.33 .33 -.12 1 0 .33 .12 .12 .33 0 1 -.12 .33 -.33 .12 -1 0 -.33 -.12 -.12 -.33 0 -1Z" />
  </defs>

  <rect width="512" height="512" fill="url(#sky)" />
  <circle cx="256" cy="250" r="230" fill="url(#glow)" />
  <!-- rolling green hill -->
  <path d="M0 430 Q130 380 256 400 Q390 420 512 380 V512 H0Z" fill="#5fbf6f" />
  <path d="M0 455 Q150 420 256 440 Q380 460 512 430 V512 H0Z" fill="#4aa85c" />

  <!-- shoulders: orange jacket + grey backpack straps -->
  <path d="M96 512 Q104 390 256 384 Q408 390 416 512Z" fill="url(#jacket)" />
  <path d="M200 400 Q256 430 312 400 L304 386 Q256 410 208 386Z" fill="#c8622a" />
  <rect x="166" y="398" width="26" height="114" rx="8" fill="#7f7a70" />
  <rect x="320" y="398" width="26" height="114" rx="8" fill="#7f7a70" />
  <path d="M256 412 V512" stroke="#e0e0e6" stroke-width="5" />

  <!-- hair behind the face -->
  <path d="M120 250 Q104 110 256 92 Q408 110 392 250 Q412 330 388 392 Q360 410 344 384 L168 384 Q152 410 124 392 Q100 330 120 250Z" fill="url(#hair)" />

  <!-- face -->
  <ellipse cx="256" cy="268" rx="118" ry="112" fill="#f9dcc6" />
  <!-- straight-cut bangs -->
  <path d="M134 250 Q130 120 256 112 Q382 120 378 250 Q372 214 256 208 Q140 214 134 250Z" fill="url(#hair)" />
  <path d="M176 150 Q230 124 300 132" stroke="#8c7b70" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- big amber eyes -->
  <g>
    <ellipse cx="208" cy="276" rx="34" ry="38" fill="#fffdf8" />
    <ellipse cx="304" cy="276" rx="34" ry="38" fill="#fffdf8" />
    <circle cx="210" cy="281" r="27" fill="#b8621d" />
    <circle cx="306" cy="281" r="27" fill="#b8621d" />
    <circle cx="210" cy="284" r="17" fill="#f2a145" opacity="0.55" />
    <circle cx="306" cy="284" r="17" fill="#f2a145" opacity="0.55" />
    <circle cx="210" cy="281" r="12" fill="#140804" />
    <circle cx="306" cy="281" r="12" fill="#140804" />
    <circle cx="199" cy="268" r="8" fill="#fff" />
    <circle cx="295" cy="268" r="8" fill="#fff" />
    <circle cx="219" cy="293" r="3.5" fill="#fff" />
    <circle cx="315" cy="293" r="3.5" fill="#fff" />
    <path d="M170 262 Q208 228 246 262 M266 262 Q304 228 342 262" stroke="#1e1512" stroke-width="9" fill="none" stroke-linecap="round" />
    <path d="M170 262 L158 250 M342 262 L354 250" stroke="#1e1512" stroke-width="7" stroke-linecap="round" />
  </g>
  <!-- soft blush, nose, smile -->
  <ellipse cx="166" cy="322" rx="24" ry="14" fill="#ff9b8f" opacity="0.45" />
  <ellipse cx="346" cy="322" rx="24" ry="14" fill="#ff9b8f" opacity="0.45" />
  <ellipse cx="256" cy="320" rx="9" ry="6" fill="#efc2a6" />
  <path d="M232 344 Q256 362 280 344" stroke="#c4655c" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- golden magic sparkles -->
  <use href="#spark" transform="translate(420 92) scale(44)" fill="#fff3b0" />
  <use href="#spark" transform="translate(420 92) scale(26)" fill="#ffffff" />
  <use href="#spark" transform="translate(86 140) scale(20)" fill="#fff3b0" />
  <use href="#spark" transform="translate(458 210) scale(14)" fill="#ffffff" opacity="0.9" />
  <use href="#spark" transform="translate(66 64) scale(12)" fill="#ffffff" opacity="0.85" />
</svg>
