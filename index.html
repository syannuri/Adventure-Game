<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a4a" />
    <title>Anet: Petualangan Ajaib</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@600;700&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Instant splash: shown before the game's JavaScript has downloaded -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #ffe9c7 0%, #f5c9a0 45%, #7b5cff 140%); transition: opacity 0.5s ease; font-family: 'Luckiest Guy', 'Baloo 2', system-ui, sans-serif; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .t { font-size: min(22vw, 26vh); line-height: 1; color: #ffc928; -webkit-text-stroke: 0.06em #3b1a78; paint-order: stroke fill; text-shadow: 0 0.08em 0 #2a1060; letter-spacing: 0.02em; animation: sb 1.6s ease-in-out infinite; }
      #splash .s { margin-top: 2vh; text-align: center; font: 700 18px 'Baloo 2', system-ui, sans-serif; color: #3b1a78; opacity: 0.8; }
      #splash .dots span { display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%; background: #7b5cff; animation: sd 1s ease-in-out infinite; }
      #splash .dots span:nth-child(2) { animation-delay: 0.15s; }
      #splash .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes sb { 50% { transform: translateY(-3%) rotate(-2deg); } }
      @keyframes sd { 50% { transform: translateY(-8px); opacity: 0.5; } }
    </style>
    <div id="splash"><div><div class="t">ANET</div><div class="s"><div class="dots"><span></span><span></span><span></span></div></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
